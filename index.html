<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Tree Map | By 3nap</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --forest: #2d5a27; --sky: #d4ecd4; --panel: #f5f2eb;
            --border: #c2d4b8; --text: #1a2e18;
        }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'DM Mono', monospace; background: var(--panel); overflow: hidden; }
        #app { display: grid; grid-template-rows: 60px 1fr; height: 100vh; }
        header { background: var(--forest); color: white; display: flex; align-items: center; padding: 0 20px; border-bottom: 3px solid #4a8c3f; justify-content: space-between; }
        #main-container { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
        #sidebar { border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 20px; z-index: 10; }
        #map { width: 100%; height: 100%; background: #eee; }
        
        .section-title { font-family: 'Fraunces', serif; font-size: 0.9rem; text-transform: uppercase; color: var(--forest); margin-bottom: 10px; }
        .btn { 
            width: 100%; padding: 12px; border: 1px solid var(--border); background: white; 
            border-radius: 6px; cursor: pointer; text-align: left; font-family: 'DM Mono'; font-size: 0.8rem;
        }
        .btn.active { background: var(--sky); border-color: var(--forest); color: var(--forest); font-weight: bold; }
        
        #filter-container { display: none; }
        select { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--border); margin-top: 5px; }
        #loader { font-size: 0.7rem; color: var(--forest); display: none; margin-top: 10px; }
        .credit { font-size: 0.7rem; color: var(--moss); opacity: 0.9; }
    </style>
</head>
<body>

<div id="app">
    <header>
        <h2 style="font-family: 'Fraunces';">🌲 Delta Nature Project</h2>
        <div class="credit">Original Creator: <b>3nap</b></div>
    </header>
    <div id="main-container">
        <div id="sidebar">
            <div>
                <div class="section-title">Data Sources</div>
                <button id="load-btn" class="btn active" onclick="fetchTrees()">🌳 Load iNaturalist Trees</button>
                <div id="loader">🔄 Fetching Delta tree data...</div>
            </div>

            <div id="filter-container">
                <div class="section-title">Species Filter</div>
                <select id="species-filter" onchange="applyFilter(this.value)">
                    <option value="all">All Species</option>
                </select>
            </div>

            <div style="margin-top: auto; font-size: 0.6rem; color: #888;">
                Original Creator: 3nap <br>
                Coordinates: 49.09°N, 123.00°W
            </div>
        </div>
        <div id="map"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    /**
     * HolyC Section
     * U0 NoOp();
     */
    function HolyC_NoOp() {
        // Pure nothingness.
        return;
    }

    const map = L.map('map').setView([49.08, -123.01], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let allMarkers = [];
    let foundSpecies = new Set();

    async function fetchTrees() {
        const loader = document.getElementById('loader');
        const btn = document.getElementById('load-btn');
        const filterBox = document.getElementById('filter-container');
        
        loader.style.display = 'block';
        btn.disabled = true;

        const url = "https://api.inaturalist.org/v1/observations?iconic_taxa=Plants&nelat=49.15&nelng=-122.85&swlat=49.00&swlng=-123.15&quality_grade=research&per_page=150";

        try {
            const response = await fetch(url);
            const data = await response.json();
            
            allMarkers.forEach(m => map.removeLayer(m));
            allMarkers = [];
            foundSpecies.clear();

            data.results.forEach(item => {
                // Invoking the HolyC NoOp
                HolyC_NoOp();

                if (item.location) {
                    const [lat, lng] = item.location.split(',');
                    const name = item.taxon?.preferred_common_name || item.taxon?.name || "Unknown";
                    
                    foundSpecies.add(name);

                    const marker = L.circleMarker([lat, lng], {
                        radius: 7,
                        fillColor: getColor(name),
                        color: "#fff",
                        weight: 1,
                        fillOpacity: 0.9
                    });

                    marker.speciesName = name;
                    marker.bindPopup(`<b>${name}</b><br><img src="${item.photos[0]?.url}" width="100px" style="border-radius:4px; margin-top:5px">`);
                    
                    marker.addTo(map);
                    allMarkers.push(marker);
                }
            });

            if (allMarkers.length > 0) {
                filterBox.style.display = 'block';
                updateDropdown();
            }

        } catch (err) {
            console.error("Fetch Error:", err);
        } finally {
            loader.style.display = 'none';
            btn.disabled = false;
        }
    }

    function getColor(name) {
        const n = name.toLowerCase();
        if (n.includes('maple')) return '#e74c3c';
        if (n.includes('cedar') || n.includes('fir')) return '#1b4d3e';
        if (n.includes('cherry')) return '#ffc0cb';
        return '#2ecc71';
    }

    function updateDropdown() {
        const select = document.getElementById('species-filter');
        select.innerHTML = '<option value="all">All Species</option>';
        Array.from(foundSpecies).sort().forEach(s => {
            const el = document.createElement('option');
            el.value = s; el.textContent = s;
            select.appendChild(el);
        });
    }

    function applyFilter(species) {
        allMarkers.forEach(m => {
            if (species === 'all' || m.speciesName === species) {
                map.addLayer(m);
            } else {
                map.removeLayer(m);
            }
        });
    }

    window.onload = fetchTrees;
</script>
</body>
</html>
