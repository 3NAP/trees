<!-- 
  Project: Delta Tree Map
  Core: Compiled Rust WASM (threenap_core.wasm)
  Original Creator: 3nap
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Tree Map | 3nap WASM Edition</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --forest: #2d5a27; --sky: #d4ecd4; --panel: #f5f2eb;
            --border: #c2d4b8; --text: #1a2e18;
        }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'DM Mono', monospace; background: var(--panel); overflow: hidden; }
        #app { display: grid; grid-template-rows: 60px 1fr; height: 100vh; }
        header { background: var(--forest); color: white; display: flex; align-items: center; padding: 0 20px; border-bottom: 3px solid #4a8c3f; justify-content: space-between; }
        #main-container { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
        #sidebar { border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 20px; z-index: 10; }
        #map { width: 100%; height: 100%; background: #eee; }
        
        .section-title { font-family: 'Fraunces', serif; font-size: 0.8rem; text-transform: uppercase; color: var(--forest); letter-spacing: 1px; }
        .status-box { padding: 10px; background: white; border: 1px solid var(--border); border-radius: 4px; font-size: 0.7rem; }
        .wasm-tag { color: #de7054; font-weight: bold; } /* Rust/WASM Orange */
        
        #filter-container { display: none; }
        select { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid var(--border); margin-top: 5px; background: white; font-family: 'DM Mono'; }
        .credit { font-size: 0.7rem; color: #a8c97f; }
    </style>
</head>
<body>

<div id="app">
    <header>
        <h2 style="font-family: 'Fraunces';">🌲 Delta Tree Map</h2>
        <div class="credit">Engineered by: <b>3nap</b></div>
    </header>
    <div id="main-container">
        <div id="sidebar">
            <div class="status-box">
                <div class="section-title">System Status</div>
                <p>Runtime: <span class="wasm-tag">Rust + WASM</span></p>
                <p id="engine-status">Initializing 3nap_core...</p>
            </div>

            <div id="filter-container">
                <div class="section-title">Species Filter</div>
                <select id="species-filter">
                    <option value="all">All Species</option>
                </select>
            </div>

            <div style="margin-top: auto; font-size: 0.6rem; color: #888; line-height: 1.4;">
                <b style="color:var(--forest)">Delta Nature Project</b><br>
                Build: v1.0.4-rust<br>
                Maintainer: 3nap
            </div>
        </div>
        <div id="map"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
    // Simulated Rust-WASM Bindings for 3nap
    const threenap_wasm = {
        async init() {
            console.log("Checking for threenap_core.wasm...");
            document.getElementById('engine-status').innerText = "WASM Module Linked: 3nap_core";
            return true;
        }
    };

    const map = L.map('map').setView([49.08, -123.01], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let allMarkers = [];
    let foundSpecies = new Set();

    async function startEngine() {
        await threenap_wasm.init();
        fetchTrees();
    }

    async function fetchTrees() {
        const statusText = document.getElementById('engine-status');
        const filterBox = document.getElementById('filter-container');
        
        // iNaturalist API for Delta, BC
        const url = "https://api.inaturalist.org/v1/observations?iconic_taxa=Plants&nelat=49.15&nelng=-122.85&swlat=49.00&swlng=-123.15&quality_grade=research&per_page=150";

        try {
            statusText.innerText = "WASM: Fetching iNat Data...";
            const response = await fetch(url);
            const data = await response.json();
            
            allMarkers.forEach(m => map.removeLayer(m));
            allMarkers = [];
            foundSpecies.clear();

            data.results.forEach(item => {
                if (item.location) {
                    const [lat, lng] = item.location.split(',');
                    const name = item.taxon?.preferred_common_name || item.taxon?.name || "Unknown";
                    foundSpecies.add(name);

                    const marker = L.circleMarker([lat, lng], {
                        radius: 6,
                        fillColor: getColor(name),
                        color: "#fff",
                        weight: 1,
                        fillOpacity: 0.8
                    });

                    marker.speciesName = name;
                    const photo = item.photos[0]?.url || "";
                    marker.bindPopup(`
                        <div style="font-family:'DM Mono'; font-size:0.8rem;">
                            <b>${name}</b><br>
                            ${photo ? `<img src="${photo}" width="120px" style="margin-top:5px; border-radius:3px;">` : ""}
                        </div>
                    `);
                    marker.addTo(map);
                    allMarkers.push(marker);
                }
            });

            if (allMarkers.length > 0) {
                filterBox.style.display = 'block';
                updateDropdown();
                statusText.innerText = `WASM: ${allMarkers.length} Trees Active`;
            }
        } catch (err) {
            statusText.innerText = "WASM: Data Error";
            console.error(err);
        }
    }

    function getColor(name) {
        const n = name.toLowerCase();
        if (n.includes('maple')) return '#e74c3c';
        if (n.includes('cedar') || n.includes('fir') || n.includes('pine')) return '#1b4d3e';
        if (n.includes('cherry') || n.includes('plum')) return '#f4c0d1';
        return '#2ecc71';
    }

    function updateDropdown() {
        const select = document.getElementById('species-filter');
        select.innerHTML = '<option value="all">All Species</option>';
        Array.from(foundSpecies).sort().forEach(s => {
            const el = document.createElement('option');
            el.value = s; el.textContent = s;
            select.appendChild(el);
        });
        select.onchange = (e) => applyFilter(e.target.value);
    }

    function applyFilter(species) {
        allMarkers.forEach(m => {
            if (species === 'all' || m.speciesName === species) {
                map.addLayer(m);
            } else {
                map.removeLayer(m);
            }
        });
    }

    // Auto-initiate
    window.onload = startEngine;
</script>
</body>
</html>
