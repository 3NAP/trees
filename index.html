<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Tree & Nature Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --forest: #2d5a27; --forest-mid: #4a8c3f; --forest-light: #7cbf6e;
            --bark: #5c3d1e; --moss: #a8c97f; --soil: #c8a96e; --sky: #d4ecd4;
            --panel: #f5f2eb; --text: #1a2e18; --text-muted: #5a7055;
            --border: #c2d4b8; --accent: #e8823a;
        }
        html, body { height: 100%; font-family: 'DM Mono', monospace; background: var(--panel); color: var(--text); overflow: hidden; }
        #app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
        header { background: var(--forest); color: #fff; padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 56px; border-bottom: 3px solid var(--forest-light); z-index: 1000; position: relative; }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 32px; height: 32px; background: var(--forest-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .logo-text { font-family: 'Fraunces', serif; font-size: 1.15rem; font-weight: 600; color: #fff; }
        #map-container { display: grid; grid-template-columns: 280px 1fr; height: 100%; overflow: hidden; }
        #sidebar { background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; display: flex; flex-direction: column; z-index: 500; }
        .sidebar-section { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); }
        .sidebar-section h3 { font-family: 'Fraunces', serif; font-size: 0.8rem; font-weight: 600; color: var(--forest); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.75rem; }
        .layer-toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 6px 8px; border-radius: 6px; transition: background 0.15s; border: none; background: transparent; width: 100%; text-align: left; font-family: 'DM Mono', monospace; font-size: 0.72rem; }
        .layer-toggle:hover { background: var(--sky); }
        .layer-toggle.active { background: var(--sky); color: var(--forest); }
        .toggle-check { width: 14px; height: 14px; border: 1.5px solid var(--border); border-radius: 3px; margin-left: auto; position: relative; }
        .layer-toggle.active .toggle-check { background: var(--forest); border-color: var(--forest); }
        .layer-toggle.active .toggle-check::after { content: '✓'; color: white; font-size: 10px; position: absolute; top: -2px; left: 2px; }
        #map { width: 100%; height: 100%; z-index: 1; }
        #loading-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(245, 242, 235, 0.8); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #loading-overlay.visible { display: flex; }
        #info-panel { position: absolute; bottom: 2rem; right: 1rem; width: 280px; background: white; border: 1px solid var(--border); border-radius: 10px; padding: 1rem; z-index: 800; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        #info-panel.visible { display: block; }
        select { width: 100%; padding: 8px; border-radius: 5px; border: 1px solid var(--border); font-family: 'DM Mono'; font-size: 0.7rem; background: white; margin-top: 5px; }
    </style>
</head>
<body>
<div id="app">
    <header>
        <div class="logo"><div class="logo-icon">🌲</div><div><div class="logo-text">Delta Tree Map</div></div></div>
        <div style="font-size: 0.7rem; color: #a8c97f;">v1.2 · Live iNaturalist + OSM Integration</div>
    </header>
    <div id="map-container">
        <div id="sidebar">
            <div class="sidebar-section">
                <h3>🌳 Live Tree Data</h3>
                <button class="layer-toggle active" onclick="toggleTreeLayer('inat', this)">iNaturalist Observations (verified)</button>
                <button class="layer-toggle" onclick="toggleTreeLayer('osm', this)">OpenStreetMap Trees</button>
                <div style="margin-top:10px">
                    <label style="font-size: 0.65rem; color: var(--text-muted);">FILTER BY SPECIES:</label>
                    <select id="species-filter" onchange="filterBySpecies(this.value)">
                        <option value="all">All Species Found</option>
                    </select>
                </div>
            </div>
            <div class="sidebar-section">
                <h3>🏞️ Infrastructure & Nature</h3>
                <button class="layer-toggle" onclick="toggleDeltaLayer('streams', this)">Delta Streams</button>
                <button class="layer-toggle" onclick="toggleDeltaLayer('ramsar', this)">Protected Wetlands</button>
            </div>
            <div style="padding: 1rem; font-size: 0.6rem; color: var(--text-muted); margin-top: auto;">
                Data is fetched live from iNaturalist API and Overpass (OSM).
            </div>
        </div>
        <div id="map"></div>
        <div id="loading-overlay"><div style="font-size:2rem">🌱</div><div>Gathering nature data...</div></div>
        <div id="info-panel">
            <button onclick="document.getElementById('info-panel').classList.remove('visible')" style="float:right; border:none; background:none; cursor:pointer;">✕</button>
            <h4 id="info-title" style="font-family:Fraunces; color:var(--forest)">Details</h4>
            <div id="info-content" style="font-size:0.75rem; margin-top:10px;"></div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([49.09, -123.00], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let treeMarkers = [];
    const speciesList = new Set();

    function showLoading(show) { document.getElementById('loading-overlay').classList.toggle('visible', show); }

    // FETCH FROM iNATURALIST
    async function fetchINat() {
        showLoading(true);
        // Bounding box for Delta roughly: 49.0,-123.2 to 49.2,-122.8
        const url = `https://api.inaturalist.org/v1/observations?iconic_taxa=Plants&lat=49.09&lng=-123.00&radius=15&quality_grade=research&per_page=200`;
        try {
            const res = await fetch(url);
            const data = await res.json();
            data.results.forEach(obs => {
                const species = obs.taxon?.preferred_common_name || obs.taxon?.name || "Unknown Plant";
                speciesList.add(species);
                const marker = L.circleMarker([obs.location.split(',')[0], obs.location.split(',')[1]], {
                    radius: 8,
                    fillColor: getTreeColor(species),
                    color: '#fff',
                    weight: 1,
                    fillOpacity: 0.8
                }).bindPopup(`<b>${species}</b><br>Source: iNaturalist<br><img src="${obs.photos[0]?.url}" style="width:100px">`);
                marker.species = species;
                marker.addTo(map);
                treeMarkers.push(marker);
            });
            updateFilterDropdown();
        } catch (e) { console.error("iNat failed", e); }
        showLoading(false);
    }

    function getTreeColor(name) {
        if (name.includes('Maple')) return '#e24b4a';
        if (name.includes('Cedar') || name.includes('Fir')) return '#2d5a27';
        if (name.includes('Pine')) return '#1a2e18';
        if (name.includes('Cherry')) return '#f4c0d1';
        return '#7cbf6e';
    }

    function updateFilterDropdown() {
        const select = document.getElementById('species-filter');
        Array.from(speciesList).sort().forEach(s => {
            const opt = document.createElement('option');
            opt.value = s; opt.innerText = s;
            select.appendChild(opt);
        });
    }

    function filterBySpecies(val) {
        treeMarkers.forEach(m => {
            if (val === 'all' || m.species === val) {
                map.addLayer(m);
            } else {
                map.removeLayer(m);
            }
        });
    }

    // TOGGLE BUTTONS
    function toggleTreeLayer(type, btn) {
        btn.classList.toggle('active');
        if (type === 'inat' && btn.classList.contains('active')) fetchINat();
        else if (type === 'inat') {
            treeMarkers.forEach(m => map.removeLayer(m));
            treeMarkers = [];
        }
    }

    // Initial Load
    fetchINat();
</script>
</body>
</html>
